[package]
name = "app_core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tokio-postgres = "0.7.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
paste = "1"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "hostname",
] }
